    <style>
        :root {
            --text-color: #333;
            --white-alpha: rgba(255, 255, 255, 0.8);
            --accent-color: #555;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
        }

        #web_bg {
            position: fixed; width: 100%; height: 100%; z-index: -999;
            background: url('./img/sunset.jpg') no-repeat center center;
            background-size: cover;
        }

        header {
            height: 40vh;
            background: url('./img/kd.jpg') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        nav {
            position: absolute; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; box-sizing: border-box;
            background: rgba(0,0,0,0.2);
        }

        .nav-link { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }

        main {
            max-width: 900px; margin: -50px auto 40px;
            padding: 0 20px; position: relative;
        }

        .content-card {
            background: var(--white-alpha); padding: 40px;
            border-radius: 15px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1.page-title { margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        .mcm-item {
            border-left: 4px solid var(--accent-color);
            padding-left: 20px; margin: 25px 0;
        }

        .mcm-item h3 { margin: 0 0 10px 0; color: #000; }
        .mcm-item p { color: #555; line-height: 1.6; }
        .mcm-item a { color: #3498db; text-decoration: none; font-weight: bold; }
        .mcm-item a:hover { text-decoration: underline; }

        .back-home {
            display: inline-block; margin-top: 20px;
            color: var(--accent-color); text-decoration: none; font-weight: bold;
        }

        footer { text-align: center; padding: 40px; color: white; }
    </style>
</head>
